baseURL: https://mr-pig-wiki.github.io/
author: MR Physics and Instrumentation Group
languageCode: en-us
title: MR Physics and Instrumentation Group Wiki
theme: hextra

module:
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: content-sources/phantom-wiki/content
      target: content/phantoms
    - source: content-sources/rf-lab-wiki/content
      target: content/rf-lab
    - source: content-sources/tabletop-mri-wiki/content
      target: content/tabletop-mri

caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: Projects
      pageRef: /projects
      weight: 2
    - name: Contribute
      url: https://github.com/mr-pig-wiki/mr-pig-wiki.github.io/blob/d6617db/wiki-contribution-guide.md
      weight: 3
    - name: Search
      weight: 100
      params:
        type: search
    - name: GitHub
      weight: 101
      url: https://github.com/mr-pig-wiki
      params:
        icon: github

params:
  description: Open-source wiki for tools developed by the MR Physics and Instrumentation Group.

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/martinos_logo_transparent_100pix.png
      # width: 40
      # height: 20
      link: /
    width: wide
